<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="Diagram showing that the phone recognises the gesture and the server only counts the result" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg    { fill: #0B0B0C; }
      .card  { fill: #151517; stroke: rgba(237,232,225,.2); stroke-width: 1.5; rx: 8; }
      .h     { font-family: Poppins, system-ui, sans-serif; font-weight: 700; fill: #EDE8E1; }
      .lbl   { font-family: Poppins, system-ui, sans-serif; font-weight: 600; fill: #EDE8E1; }
      .body  { font-family: Inter, system-ui, sans-serif; fill: #A8A29A; }
      .mut   { font-family: Inter, system-ui, sans-serif; fill: #74706A; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #C97B4A; }
      .monom { font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #74706A; }
      .kicker{ font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #C97B4A; letter-spacing: .18em; }
      .acc   { fill: #C97B4A; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97B4A"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5661"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <text class="kicker" x="72" y="74" font-size="17">WHERE EACH DECISION GETS MADE</text>
  <text class="h" x="72" y="122" font-size="34">The phone decides. The server counts.</text>

  <!-- ── trust boundary: a faint band so arrow labels can sit on top of it ── -->
  <rect x="536" y="158" width="180" height="512" fill="#C97B4A" opacity="0.05" rx="6"/>
  <text class="mut" x="626" y="700" font-size="14.5" text-anchor="middle">trust boundary</text>

  <!-- ══ PHONE ══ -->
  <rect class="card" x="72" y="180" width="456" height="470"/>
  <rect x="72" y="180" width="456" height="4" fill="#C97B4A" rx="2"/>
  <text class="lbl"  x="104" y="228" font-size="22">Phone</text>
  <text class="mut"  x="104" y="256" font-size="15">Unity client · Android</text>

  <text class="body" x="104" y="306" font-size="16.5">Reads its own accelerometer</text>
  <text class="body" x="104" y="332" font-size="16.5">and gyroscope, every frame</text>

  <text class="body" x="104" y="384" font-size="16.5">Decides that movement</text>
  <text class="body" x="104" y="410" font-size="16.5">was a chop / a stir / a plate</text>

  <text class="body" x="104" y="462" font-size="16.5">Tracks which ingredients</text>
  <text class="body" x="104" y="488" font-size="16.5">the player selected</text>

  <text class="body" x="104" y="540" font-size="16.5">Works out the finished dish</text>
  <text class="body" x="104" y="566" font-size="16.5">and reports the result</text>

  <text class="monom" x="104" y="616" font-size="14">PhoneInput.cs · CookingManager.cs</text>

  <!-- accent ticks -->
  <circle class="acc" cx="88" cy="300" r="3.5"/>
  <circle class="acc" cx="88" cy="378" r="3.5"/>
  <circle class="acc" cx="88" cy="456" r="3.5"/>
  <circle class="acc" cx="88" cy="534" r="3.5"/>

  <!-- ══ arrow: phone → server ══ -->
  <line x1="540" y1="336" x2="712" y2="336" stroke="#C97B4A" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="mono" x="626" y="312" font-size="13.5" text-anchor="middle">SendKnifeDetection()</text>
  <text class="mut"  x="626" y="364" font-size="13.5" text-anchor="middle">one message per</text>
  <text class="mut"  x="626" y="383" font-size="13.5" text-anchor="middle">completed action</text>

  <!-- ══ arrow: unused raw-input path ══ -->
  <line x1="540" y1="560" x2="712" y2="560" stroke="#4a5661" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#am)"/>
  <text class="monom" x="626" y="536" font-size="13.5" text-anchor="middle">CmdSendInput()</text>
  <text class="mut"   x="626" y="588" font-size="13.5" text-anchor="middle">raw sensor data,</text>
  <text class="mut"   x="626" y="607" font-size="13.5" text-anchor="middle">written, never called</text>

  <!-- ══ SERVER ══ -->
  <rect class="card" x="724" y="180" width="420" height="470"/>
  <rect x="724" y="180" width="420" height="4" fill="#6E4229" rx="2"/>
  <text class="lbl" x="756" y="228" font-size="22">Server</text>
  <text class="mut" x="756" y="256" font-size="15">Dedicated PC host · Mirror</text>

  <text class="body" x="756" y="306" font-size="16.5">Counts the actions</text>
  <text class="body" x="756" y="332" font-size="16.5">it is told happened</text>

  <text class="body" x="756" y="384" font-size="16.5">Holds the cooking state</text>

  <text class="body" x="756" y="436" font-size="16.5">Stores the ingredient</text>
  <text class="body" x="756" y="462" font-size="16.5">names it receives</text>

  <text class="body" x="756" y="514" font-size="16.5">Raises the cook event</text>
  <text class="body" x="756" y="540" font-size="16.5">once six arrive</text>

  <text class="monom" x="756" y="616" font-size="14">GameManager.cs</text>

  <circle cx="740" cy="300" r="3.5" fill="#6E4229"/>
  <circle cx="740" cy="378" r="3.5" fill="#6E4229"/>
  <circle cx="740" cy="430" r="3.5" fill="#6E4229"/>
  <circle cx="740" cy="508" r="3.5" fill="#6E4229"/>

  <!-- ══ arrow: server → screen ══ -->
  <line x1="1164" y1="330" x2="1300" y2="330" stroke="#C97B4A" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="mut" x="1232" y="308" font-size="14.5" text-anchor="middle">state</text>

  <!-- ══ SCREEN ══ -->
  <rect class="card" x="1324" y="180" width="204" height="470"/>
  <rect x="1324" y="180" width="204" height="4" fill="#C97B4A" rx="2"/>
  <text class="lbl" x="1356" y="228" font-size="22">PC screen</text>
  <text class="mut" x="1356" y="256" font-size="15">what everyone</text>
  <text class="mut" x="1356" y="277" font-size="15">looks at</text>

  <text class="body" x="1356" y="330" font-size="16.5">Stations</text>
  <text class="body" x="1356" y="372" font-size="16.5">Orders</text>
  <text class="body" x="1356" y="414" font-size="16.5">Timers</text>
  <text class="body" x="1356" y="456" font-size="16.5">Feedback</text>

  <text class="mut" x="1356" y="566" font-size="14.5">no input of</text>
  <text class="mut" x="1356" y="586" font-size="14.5">any kind</text>

  <!-- ══ footnote ══ -->
  <text class="body" x="72" y="762" font-size="16.5">The server never sees the movement, so it cannot check the movement. It takes the phone at its word on every</text>
  <text class="body" x="72" y="789" font-size="16.5">judgement in the left-hand column — a deliberate trade for a single-player game made under time pressure,</text>
  <text class="body" x="72" y="816" font-size="16.5">and the first thing I would rebuild.</text>
</svg>
